<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background with rounded corners -->
  <rect width="32" height="32" rx="7" fill="#06040f"/>

  <!-- Outer ring -->
  <circle cx="16" cy="16" r="13.5" fill="none" stroke="#a78bfa" stroke-width="0.7" opacity="0.4"/>

  <!-- Mid dashed ring -->
  <circle cx="16" cy="16" r="10" fill="none" stroke="#8b5cf6" stroke-width="0.8" stroke-dasharray="2.6 1.8" opacity="0.6"/>

  <!-- Inner ring -->
  <circle cx="16" cy="16" r="6.5" fill="none" stroke="#a78bfa" stroke-width="0.7" opacity="0.45"/>

  <!-- 6 accent nodes on mid-ring (r=10 from center) -->
  <circle cx="16"   cy="6"  r="1.1" fill="#a78bfa" opacity="0.9"/>
  <circle cx="24.66" cy="11" r="1.1" fill="#a78bfa" opacity="0.9"/>
  <circle cx="24.66" cy="21" r="1.1" fill="#a78bfa" opacity="0.9"/>
  <circle cx="16"   cy="26" r="1.1" fill="#a78bfa" opacity="0.9"/>
  <circle cx="7.34"  cy="21" r="1.1" fill="#a78bfa" opacity="0.9"/>
  <circle cx="7.34"  cy="11" r="1.1" fill="#a78bfa" opacity="0.9"/>

  <!-- Core layers (arc reactor glow) -->
  <circle cx="16" cy="16" r="5.2" fill="#2e1065" opacity="0.9"/>
  <circle cx="16" cy="16" r="3.6" fill="#6d28d9" opacity="0.75"/>
  <circle cx="16" cy="16" r="2"   fill="#c4b5fd" opacity="0.95"/>

  <!-- Bright centre pinpoint -->
  <circle cx="16" cy="16" r="0.9" fill="#ede8ff"/>
</svg>
